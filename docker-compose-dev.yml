services:
  air780e-bridge:
    build: .
    container_name: air780e-bridge
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - 8104:8000
    devices:
      # 把 19d1:0001（BYD EigenComm Compo）的 AT 串口映射进容器
      - /dev/ttyACM0:/dev/ttyACM0
      - /dev/ttyACM1:/dev/ttyACM1
      - /dev/ttyACM2:/dev/ttyACM2
    volumes:
      - ./data:/data
